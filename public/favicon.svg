<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QF">
  <!-- Amtsblau wie auf der Seite. Die Buchstaben sind als Geometrie gezeichnet,
       nicht als Text: Im Favicon steht keine Webschrift zur Verfügung, gesetzter
       Text sähe auf jedem System anders aus. Strichstärke und Punze sind so
       gewählt, dass die Marke auch bei 16 Pixeln nicht zuläuft. -->
  <rect width="64" height="64" rx="11" fill="#12456d"/>
  <g fill="none" stroke="#ffffff" stroke-width="6">
    <circle cx="21" cy="29" r="11.5"/>
    <path d="M25 34 L34 44" stroke-linecap="butt"/>
  </g>
  <g fill="#ffffff">
    <rect x="43" y="17" width="6.5" height="30"/>
    <rect x="43" y="17" width="15" height="6.5"/>
    <rect x="43" y="28.5" width="11.5" height="6.5"/>
  </g>
</svg>
